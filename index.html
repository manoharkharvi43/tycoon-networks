<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tycoon Networks | Pick a Design</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', system-ui, sans-serif; background: #f6f1fb; color: #1f1530; min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; text-align: center; }
  img { width: 110px; border-radius: 50%; margin-bottom: 18px; }
  h1 { font-size: 26px; margin-bottom: 28px; }
  .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 16px; justify-content: center; }
  a { display: block; background: #fff; border: 2px solid #e4d8f0; border-radius: 16px; padding: 24px 18px; text-decoration: none; color: inherit; transition: .2s; }
  a:hover { border-color: #663399; transform: translateY(-3px); }
  b { display: block; font-size: 34px; color: #663399; }
  span { color: #625a70; font-size: 14px; }
  @media (max-width: 700px) { .opts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <main>
    <img src="logo.jpg" alt="Tycoon Networks logo">
    <h1>Tycoon Networks — choose a design</h1>
    <div class="opts">
      <a href="1/"><b>/1</b><span>Classic light, icon cards</span></a>
      <a href="2/"><b>/2</b><span>Dark, glowing tech look</span></a>
      <a href="3/"><b>/3</b><span>Editorial serif, cream</span></a>
    </div>
  </main>
</body>
</html>
